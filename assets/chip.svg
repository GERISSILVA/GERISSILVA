<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-label="Processador com trilhas de circuito">
  <defs>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2a38"/>
      <stop offset="1" stop-color="#06131b"/>
    </linearGradient>
    <style>
      .line { stroke: #00B4D8; stroke-opacity: .35; stroke-width: 2; fill: none; }
      .flow { stroke: #48D6F0; stroke-width: 2.5; fill: none; stroke-linecap: round;
              stroke-dasharray: 14 120; animation: run 3.2s linear infinite; }
      .flow.b { animation-delay: -1.1s; }
      .flow.c { animation-delay: -2.2s; }
      .node { fill: #00B4D8; }
      .pin  { fill: #00B4D8; fill-opacity: .8; }
      @keyframes run { to { stroke-dashoffset: -134; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>

  <g>
    <path class="line" d="M0 90 H150 L190 110 H330"/>
    <path class="line" d="M0 140 H330"/>
    <path class="line" d="M0 190 H150 L190 170 H330"/>
    <path class="flow"   d="M0 90 H150 L190 110 H330"/>
    <path class="flow b" d="M0 140 H330"/>
    <path class="flow c" d="M0 190 H150 L190 170 H330"/>
    <circle class="node" cx="150" cy="90" r="4"/>
    <circle class="node" cx="150" cy="190" r="4"/>
    <circle class="node" cx="60" cy="140" r="4"/>
  </g>

  <g transform="translate(800 0) scale(-1 1)">
    <path class="line" d="M0 90 H150 L190 110 H330"/>
    <path class="line" d="M0 140 H330"/>
    <path class="line" d="M0 190 H150 L190 170 H330"/>
    <path class="flow b" d="M0 90 H150 L190 110 H330"/>
    <path class="flow c" d="M0 140 H330"/>
    <path class="flow"   d="M0 190 H150 L190 170 H330"/>
    <circle class="node" cx="150" cy="90" r="4"/>
    <circle class="node" cx="150" cy="190" r="4"/>
    <circle class="node" cx="60" cy="140" r="4"/>
  </g>

  <g class="pin">
    <rect x="352" y="42" width="8" height="26" rx="2"/>
    <rect x="376" y="42" width="8" height="26" rx="2"/>
    <rect x="400" y="42" width="8" height="26" rx="2"/>
    <rect x="424" y="42" width="8" height="26" rx="2"/>
    <rect x="352" y="212" width="8" height="26" rx="2"/>
    <rect x="376" y="212" width="8" height="26" rx="2"/>
    <rect x="400" y="212" width="8" height="26" rx="2"/>
    <rect x="424" y="212" width="8" height="26" rx="2"/>
  </g>

  <rect x="330" y="64" width="140" height="152" rx="14" fill="url(#die)" stroke="#00B4D8" stroke-width="2.5"/>
  <rect x="346" y="80" width="108" height="120" rx="8" fill="none" stroke="#00B4D8" stroke-opacity=".35"/>

  <g fill="#00B4D8" fill-opacity=".18" stroke="#00B4D8" stroke-opacity=".6">
    <rect x="360" y="94" width="36" height="28" rx="4"/>
    <rect x="404" y="94" width="36" height="28" rx="4"/>
    <rect x="360" y="158" width="36" height="28" rx="4"/>
    <rect x="404" y="158" width="36" height="28" rx="4"/>
  </g>
  <rect x="360" y="130" width="80" height="20" rx="4" fill="#00B4D8" fill-opacity=".35"/>

  <path d="M338 72 l10 0 l-10 10 z" fill="#48D6F0"/>
</svg>
